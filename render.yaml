services:
  - type: web
    name: instagram-ai-publisher
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11

      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_ID
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false

      - key: INSTAGRAM_USER_ID
        sync: false

      - key: GRAPH_API_VERSION
        value: v24.0

      - key: PUBLIC_BASE_URL
        sync: false

      - key: TELEGRAM_CHANNEL
        sync: false

      - key: CONTENT_LANGUAGE
        value: Hinglish

      - key: CONTENT_STYLE
        value: "funny, clever, premium, Gen-Z, slightly teasing"

      - key: GEMINI_TEXT_MODEL
        value: gemini-3.6-flash

      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image

      - key: POST_INTERVAL_HOURS
        value: "6"

      - key: DAILY_POST_LIMIT
        value: "3"

      - key: PORT
        value: "10000"
